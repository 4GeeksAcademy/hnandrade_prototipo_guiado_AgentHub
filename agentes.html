<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentes | AgentHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script>if (localStorage.getItem('agenthub-theme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
  <aside class="fixed inset-y-0 left-0 z-30 w-64 border-r border-gray-200 bg-gray-100 dark:border-gray-700 dark:bg-gray-900">
    <div class="flex h-16 items-center border-b border-gray-200 px-6 dark:border-gray-700"><a href="index.html" class="flex items-center gap-3 text-lg font-bold text-gray-950 dark:text-white"><span class="flex h-8 w-8 items-center justify-center rounded-md bg-gray-900 text-sm text-white dark:bg-white dark:text-gray-900">AH</span><span>AgentHub</span></a></div>
    <nav aria-label="Navegación principal" class="space-y-1 p-4">
      <a data-nav-link href="index.html" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-gray-600 hover:bg-gray-200 hover:text-gray-950 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75h6.5v6.5h-6.5v-6.5Zm10 0h6.5v6.5h-6.5v-6.5Zm-10 10h6.5v6.5h-6.5v-6.5Zm10 0h6.5v6.5h-6.5v-6.5Z"/></svg>Dashboard</a>
      <a data-nav-link href="usuarios.html" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-gray-600 hover:bg-gray-200 hover:text-gray-950 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a7.5 7.5 0 0 1 15 0"/></svg>Usuarios</a>
      <a data-nav-link href="agentes.html" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-gray-600 hover:bg-gray-200 hover:text-gray-950 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 3.75h6M12 3.75v-1.5M5.25 9A3.75 3.75 0 0 1 9 5.25h6A3.75 3.75 0 0 1 18.75 9v7.5A3.75 3.75 0 0 1 15 20.25H9a3.75 3.75 0 0 1-3.75-3.75V9Zm3 3h.008v.008H8.25V12Zm7.5 0h.008v.008h-.008V12ZM9 16.5h6"/></svg>Agentes</a>
      <a data-nav-link href="skills.html" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-gray-600 hover:bg-gray-200 hover:text-gray-950 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m12 2.75 2.1 5.15 5.15 2.1-5.15 2.1L12 17.25l-2.1-5.15L4.75 10 9.9 7.9 12 2.75Zm6.25 12.5.8 1.95 1.95.8-1.95.8-.8 1.95-.8-1.95-1.95-.8 1.95-.8.8-1.95Z"/></svg>Skills</a>
      <a data-nav-link href="contrataciones.html" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-gray-600 hover:bg-gray-200 hover:text-gray-950 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75V5.25A2.25 2.25 0 0 1 10.5 3h3A2.25 2.25 0 0 1 15.75 5.25v1.5m-12 3h16.5m-15-3h13.5A1.5 1.5 0 0 1 20.25 8.25v10.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5V8.25a1.5 1.5 0 0 1 1.5-1.5ZM9.75 12h4.5"/></svg>Contrataciones</a>
      <a data-nav-link href="errores.html" class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-gray-600 hover:bg-gray-200 hover:text-gray-950 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.3 3.6 2.65 17.1a2.1 2.1 0 0 0 1.83 3.15h15.04a2.1 2.1 0 0 0 1.83-3.15L13.7 3.6a1.95 1.95 0 0 0-3.4 0ZM12 8.25v4.5m0 3.5v.01"/></svg>Log de errores</a>
    </nav>
  </aside>
  <header class="fixed left-64 right-0 top-0 z-20 flex h-16 items-center justify-between border-b border-gray-200 bg-gray-100 px-6 dark:border-gray-700 dark:bg-gray-800">
    <p class="shrink-0 text-sm font-medium text-gray-600 dark:text-gray-300">Consola / Operaciones</p>
    <div class="ml-6 flex min-w-0 flex-1 items-center justify-end gap-4"><label class="relative hidden w-full max-w-md lg:block"><span class="sr-only">Buscar</span><svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m16.25 16.25 4 4"/></svg><input disabled type="search" placeholder="Buscar agente, cliente o contrato..." class="h-9 w-full rounded-md border border-gray-300 bg-white pl-9 pr-3 text-sm text-gray-500 placeholder:text-gray-400 disabled:cursor-not-allowed dark:border-gray-600 dark:bg-gray-900 dark:text-gray-300"></label>
      <button id="theme-toggle" type="button" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-gray-300 text-gray-600 hover:bg-gray-200 dark:border-gray-600 dark:text-gray-200 dark:hover:bg-gray-700" aria-label="Activar modo oscuro" aria-pressed="false"><svg data-theme-icon="moon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 15.1A8.5 8.5 0 0 1 8.9 3.75a8.5 8.5 0 1 0 11.35 11.35Z"/></svg><svg data-theme-icon="sun" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="3.75"/><path stroke-linecap="round" d="M12 2.25v2m0 15.5v2m9.75-9.75h-2M4.25 12h-2m16.64-6.89-1.42 1.42M6.53 17.47l-1.42 1.42m13.78 0-1.42-1.42M6.53 6.53 5.11 5.11"/></svg></button>
      <div class="min-w-0 border-l border-gray-300 pl-4 dark:border-gray-600"><p class="truncate text-sm font-semibold text-gray-900 dark:text-white">Admin Operaciones</p><p class="truncate text-xs text-gray-500 dark:text-gray-400">Superadmin</p></div>
    </div>
  </header>
  <main id="main-content" class="ml-64 mt-16 h-[calc(100vh-4rem)] overflow-y-auto p-8">
    <div class="mx-auto max-w-7xl space-y-6">
      <section aria-labelledby="agentes-title">
        <h1 id="agentes-title" class="text-2xl font-bold text-gray-950 dark:text-white">Agentes</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Inventario operativo de agentes alquilados por cliente.</p>
      </section>

      <section aria-labelledby="agentes-resumen-title">
        <h2 id="agentes-resumen-title" class="sr-only">Resumen de agentes</h2>
        <div id="agentes-summary" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4"></div>
      </section>

      <section aria-labelledby="agentes-listado-title" class="rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-800">
        <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-700">
          <h2 id="agentes-listado-title" class="text-sm font-semibold text-gray-950 dark:text-white">Agentes contratados</h2>
        </div>
        <div class="overflow-x-auto overflow-y-visible">
          <div id="agentes-list" class="min-w-[760px] divide-y divide-gray-200 dark:divide-gray-700"></div>
        </div>
      </section>
    </div>

    <div id="agent-config-modal" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center bg-gray-950/50 p-4" aria-hidden="true">
      <section class="w-full max-w-2xl rounded-xl border border-gray-200 bg-white shadow-xl dark:border-gray-700 dark:bg-gray-800" role="dialog" aria-modal="true" aria-labelledby="agent-config-title">
        <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4 dark:border-gray-700">
          <h2 id="agent-config-title" class="text-base font-semibold text-gray-950 dark:text-white">Configurar agente</h2>
          <button id="close-agent-modal" type="button" class="flex h-8 w-8 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-950 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white" aria-label="Cerrar configuración">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m6.75 6.75 10.5 10.5m0-10.5-10.5 10.5"/></svg>
          </button>
        </div>
        <div class="space-y-4 px-5 py-5">
          <label for="agent-system-prompt" class="block text-sm font-medium text-gray-700 dark:text-gray-300">System prompt</label>
          <textarea id="agent-system-prompt" rows="8" class="w-full rounded-lg border border-gray-300 bg-white px-3 py-3 font-mono text-sm text-gray-900 shadow-sm focus:border-gray-500 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 dark:focus:border-gray-400 dark:focus:ring-gray-700"></textarea>
          <div class="flex justify-end">
            <button id="save-agent-prompt" type="button" class="rounded-md bg-gray-900 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-700 dark:bg-white dark:text-gray-900 dark:hover:bg-gray-200">Guardar cambios</button>
          </div>
        </div>
      </section>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const summaryContainer = document.getElementById("agentes-summary");
        const agentsList = document.getElementById("agentes-list");
        const configModal = document.getElementById("agent-config-modal");
        const configTitle = document.getElementById("agent-config-title");
        const promptTextarea = document.getElementById("agent-system-prompt");
        const closeModalButton = document.getElementById("close-agent-modal");
        const savePromptButton = document.getElementById("save-agent-prompt");
        let selectedAgentIndex = null;

        const statusClasses = {
          Activo: "bg-emerald-100 text-emerald-700 ring-emerald-600/20 dark:bg-emerald-400/10 dark:text-emerald-300 dark:ring-emerald-400/20",
          Fallando: "bg-red-100 text-red-700 ring-red-600/20 dark:bg-red-400/10 dark:text-red-300 dark:ring-red-400/20",
          Inactivo: "bg-slate-100 text-slate-700 ring-slate-600/20 dark:bg-slate-700 dark:text-slate-200 dark:ring-slate-500/30"
        };

        function createStatusBadge(estado) {
          return `<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset ${statusClasses[estado] || statusClasses.Inactivo}">${estado}</span>`;
        }

        function closeDropdowns() {
          document.querySelectorAll(".action-dropdown").forEach((dropdown) => dropdown.classList.add("hidden"));
          document.querySelectorAll("[data-action-toggle]").forEach((button) => button.setAttribute("aria-expanded", "false"));
        }

        function renderSummary() {
          const metrics = [
            { label: "Total agentes alquilados", value: AGENTES.length },
            { label: "Activos", value: AGENTES.filter((agente) => agente.estado === "Activo").length },
            { label: "Fallando", value: AGENTES.filter((agente) => agente.estado === "Fallando").length },
            { label: "Inactivos", value: AGENTES.filter((agente) => agente.estado === "Inactivo").length }
          ];

          summaryContainer.innerHTML = metrics.map((metric) => `
            <article class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-700 dark:bg-gray-800">
              <p class="text-sm font-medium text-gray-500 dark:text-gray-400">${metric.label}</p>
              <p class="mt-2 text-2xl font-bold text-gray-950 dark:text-white">${metric.value}</p>
            </article>
          `).join("");
        }

        function renderAgents() {
          agentsList.innerHTML = AGENTES.map((agente, index) => `
            <article class="bg-white px-5 py-4 transition-colors hover:bg-gray-50 dark:bg-gray-800 dark:hover:bg-gray-800/60">
              <div class="grid grid-cols-[1.6fr_1fr_1fr_auto] items-center gap-4">
                <div class="min-w-0">
                  <h3 class="truncate text-sm font-semibold text-gray-950 dark:text-white">${agente.nombre}</h3>
                  <p class="mt-1 truncate text-sm text-gray-500 dark:text-gray-400">${agente.propietario}</p>
                </div>
                <div>${createStatusBadge(agente.estado)}</div>
                <button type="button" class="inline-flex w-max items-center gap-2 rounded-md px-2.5 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-950 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white" data-skills-toggle="${index}" aria-expanded="false" aria-controls="agent-skills-${index}">
                  <svg class="h-4 w-4 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
                  ${agente.skills.length} skills
                </button>
                <div class="relative text-right">
                  <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-950 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white" data-action-toggle="${index}" aria-label="Abrir acciones para ${agente.nombre}" aria-expanded="false">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
                  </button>
                  <div class="action-dropdown absolute right-0 z-10 mt-2 hidden w-40 rounded-md border border-gray-200 bg-white py-1 text-left shadow-lg dark:border-gray-700 dark:bg-gray-900">
                    <button type="button" class="block w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-800" data-configure-agent="${index}">Configurar</button>
                    <button type="button" class="block w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-gray-100 dark:text-red-300 dark:hover:bg-gray-800" data-delete-agent="${index}">Eliminar</button>
                  </div>
                </div>
              </div>
              <div id="agent-skills-${index}" class="grid max-h-0 overflow-hidden transition-all duration-300" data-skills-panel>
                <div class="flex flex-wrap gap-2 pt-4">
                  ${agente.skills.map((skill) => `<span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-900 dark:bg-gray-700 dark:text-gray-100">${skill}</span>`).join("")}
                </div>
              </div>
            </article>
          `).join("");
        }

        function openModal(index) {
          const agente = AGENTES[index];
          selectedAgentIndex = index;
          configTitle.textContent = agente.nombre;
          promptTextarea.value = agente.promptSistema;
          configModal.classList.remove("hidden");
          configModal.classList.add("flex");
          configModal.setAttribute("aria-hidden", "false");
        }

        function closeModal() {
          selectedAgentIndex = null;
          configModal.classList.add("hidden");
          configModal.classList.remove("flex");
          configModal.setAttribute("aria-hidden", "true");
        }

        agentsList.addEventListener("click", (event) => {
          const skillsToggle = event.target.closest("[data-skills-toggle]");
          const actionToggle = event.target.closest("[data-action-toggle]");
          const configureButton = event.target.closest("[data-configure-agent]");
          const deleteButton = event.target.closest("[data-delete-agent]");

          if (skillsToggle) {
            const panel = document.getElementById(skillsToggle.getAttribute("aria-controls"));
            const icon = skillsToggle.querySelector("svg");
            const willExpand = panel.classList.contains("max-h-0");
            panel.classList.toggle("max-h-0", !willExpand);
            panel.classList.toggle("max-h-40", willExpand);
            icon.classList.toggle("rotate-180", willExpand);
            skillsToggle.setAttribute("aria-expanded", String(willExpand));
            return;
          }

          if (actionToggle) {
            event.stopPropagation();
            const dropdown = actionToggle.nextElementSibling;
            const wasHidden = dropdown.classList.contains("hidden");
            closeDropdowns();
            dropdown.classList.toggle("hidden", !wasHidden);
            actionToggle.setAttribute("aria-expanded", String(wasHidden));
            return;
          }

          if (configureButton) {
            event.stopPropagation();
            closeDropdowns();
            openModal(Number(configureButton.dataset.configureAgent));
            return;
          }

          if (deleteButton) {
            event.stopPropagation();
            const index = Number(deleteButton.dataset.deleteAgent);
            const agente = AGENTES[index];
            closeDropdowns();
            if (confirm(`¿Eliminar el agente ${agente.nombre} de la plataforma?`)) {
              AGENTES.splice(index, 1);
              renderSummary();
              renderAgents();
            }
          }
        });

        savePromptButton.addEventListener("click", () => {
          if (selectedAgentIndex === null) return;
          AGENTES[selectedAgentIndex].promptSistema = promptTextarea.value;
          closeModal();
        });

        closeModalButton.addEventListener("click", closeModal);
        configModal.addEventListener("click", (event) => {
          if (event.target === configModal) {
            closeModal();
          }
        });

        renderSummary();
        renderAgents();
      });
    </script>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
